<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">


<body>
    <div class="play">
       <div class="close-btn" (click)="spotifysearch.closeWindow()">
        &times;
      </div>
 
       <iframe  
        [src]="sanitizer.bypassSecurityTrustResourceUrl('https://open.spotify.com/embed/' + spotifysearch.typeSong + '/' + spotifysearch.uriSong)"    
        width="420" 
        height="500" 
        frameborder="0" 
        allowtransparency="true" 
        allow="encrypted-media">
      </iframe>
  
      <button class="like-btn" (click)="addToLikes()" *ngIf=" spotifysearch.typeSong == 'track'" >
        <i class="bi bi-heart-fill"></i> Add to Likes
      </button>
      </div>
  </body>
