<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
</head>
<body>

<div class="profile-container">
  <div class="profile-image">
    <img id="profile-image" src={{this.user.userData.images[0].url}}  alt="Profile Image">
  </div>
  <div class="profile-info">
    <p id="country">{{this.user.userData.country}}</p>

    <h2 id="display-name">{{this.user.userData.display_name}}</h2>
    <p id="email">{{this.user.userData.email}}</p>
     
    
    
    <p>
      <a 
        id="spotify-link" 
        [href]="this.user.userData.external_urls.spotify" 
        target="_blank">
        View Profile on Spotify
      </a>
    </p>

  </div>
</div>


<br><br><br>
</body>
</html>
